[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data_enricher"
version = "0.2.0"
description = "Probabilistic models for data generation and imputation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kutay Bölat", email = "k.bolat@tudelft.nl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scipy>=1.8.1",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=6",
]
examples = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[project.urls]
Repository = "https://github.com/kabolat/data_enricher"
Paper = "https://doi.org/10.1016/j.epsr.2024.110775"
Issues = "https://github.com/kabolat/data_enricher/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
